version: 2.1

jobs:
  build:
    docker:
      - image: circleci/node:20.11.3
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Show current branch
          command: echo ${CURRENT_BRANCH}
      - restore_cahce:
        key:
          - app-{{ checksum "package.json" }}
          - app-
      - save_cache:
          paths:
            - node_modules
          key: app-{{checksum "package.json"}}
